workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    environment:
      vars:
        EXPO_PUBLIC_APP_ENV: production
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo prebuild
        script: npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Build unsigned IPA
        script: |
          cd ios
          xcodebuild archive \
            -workspace Flexini.xcworkspace \
            -scheme Flexini \
            -sdk iphoneos \
            -configuration Release \
            -archivePath /tmp/Flexini.xcarchive \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p /tmp/Payload
          cp -r "/tmp/Flexini.xcarchive/Products/Applications/Flexini.app" /tmp/Payload/
          cd /tmp
          zip -r $CM_BUILD_DIR/Flexini.ipa Payload/
    artifacts:
      - Flexini.ipa
