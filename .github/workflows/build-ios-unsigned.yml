name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - name: Expo prebuild + Generate bundle
        run: |
          rm -rf ios android
          npx expo prebuild --platform ios --clean
          cd ios
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file ../index.js \
            --bundle-output Flexini/main.jsbundle \
            --assets-dest Flexini/assets

      - name: Build unsigned IPA
        run: |
          cd ios
          SKIP_BUNDLING=1 xcodebuild archive \
            -workspace Flexini.xcworkspace \
            -scheme Flexini \
            -sdk iphoneos \
            -configuration Release \
            -archivePath /tmp/Flexini.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
          mkdir -p /tmp/Payload
          cp -r "/tmp/Flexini.xcarchive/Products/Applications/Flexini.app" /tmp/Payload/
          cd /tmp
          zip -r Flexini.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: Flexini-unsigned
          path: /tmp/Flexini.ipa
