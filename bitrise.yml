format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react-native

workflows:
  primary:
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - script@1:
          title: Install npm dependencies
          inputs:
            - content: |-
                #!/usr/bin/env bash
                npm install
      - restore-cache@1:
          inputs:
            - key: npm-cache-{{ arch }}-{{ .Branch }}
      - save-cache@1:
          inputs:
            - key: npm-cache-{{ arch }}-{{ .Branch }}
            - paths: node_modules
      - script@1:
          title: Expo prebuild
          inputs:
            - content: |-
                #!/usr/bin/env bash
                npx expo prebuild --platform ios --clean
      - cocoapods-install@2:
          inputs:
            - source_directory: ios
      - script@1:
          title: Build unsigned IPA
          inputs:
            - content: |-
                #!/usr/bin/env bash
                cd ios
                xcodebuild archive \
                  -workspace Flexini.xcworkspace \
                  -scheme Flexini \
                  -sdk iphoneos \
                  -configuration Release \
                  -archivePath /tmp/Flexini.xcarchive \
                  CODE_SIGNING_ALLOWED=NO \
                  CODE_SIGN_IDENTITY="" \
                  CODE_SIGNING_REQUIRED=NO
                mkdir -p /tmp/Payload
                cp -r "/tmp/Flexini.xcarchive/Products/Applications/Flexini.app" /tmp/Payload/
                cd /tmp
                zip -r ${BITRISE_DEPLOY_DIR}/Flexini.ipa Payload/
      - deploy-to-bitrise-io@2:
          inputs:
            - deploy_path: ${BITRISE_DEPLOY_DIR}
